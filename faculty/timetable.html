<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Timetable - CampusIQ</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .timetable-grid {
            display: grid;
            /* grid-template-columns defined by JS */
            gap: 1px;
            background-color: var(--gray-200); /* Grid lines */
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            overflow: hidden;
        }
        .timetable-header-cell, .timetable-time-cell, .timetable-class-cell {
            background-color: var(--card);
            padding: 10px;
            text-align: center;
            font-size: 0.9rem;
            color: var(--gray-800);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .timetable-header-cell {
            font-weight: 600;
            background-color: var(--gray-100);
            color: var(--neon-a);
        }
        .timetable-time-cell {
            font-weight: 500;
            background-color: var(--gray-50);
            color: var(--muted);
        }
        .timetable-class-cell {
            border-radius: 4px;
            transition: background-color 0.2s;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
            padding: 8px;
            min-height: 80px;
            position: relative; /* For action buttons */
            border: 1px solid transparent; /* For altered/suspended borders */
        }
        .timetable-class-cell:hover {
            background-color: var(--gray-50);
        }
        .timetable-class-cell.empty {
            background-color: var(--gray-100);
            cursor: default;
            color: var(--muted);
        }
        .timetable-class-cell .subject-name {
            font-weight: 600;
            color: var(--neon-a);
            font-size: 0.95rem;
        }
        .timetable-class-cell .class-details {
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 2px;
        }
        .timetable-class-cell .room-details {
            font-size: 0.7rem;
            color: var(--muted);
            margin-top: 2px;
        }
        .day-header {
            grid-column: 1 / -1; /* Span across all columns */
            background-color: var(--primary);
            color: white;
            padding: 12px;
            font-weight: 700;
            text-align: center;
            font-size: 1.1rem;
            margin-bottom: 10px;
            border-radius: 8px;
        }
        .timetable-day-row {
            display: contents; /* Allows children to be placed directly in the grid */
        }
        /* Specific styles for lunch break cell */
        .timetable-class-cell.lunch-break {
            background-color: var(--gray-100);
            color: var(--muted);
            font-weight: 600;
            grid-column: span 1; /* Ensure it spans only one period slot */
        }
        .timetable-class-cell .actions {
            position: absolute;
            bottom: 5px;
            right: 5px;
            display: none; /* Hidden by default */
            gap: 5px;
        }
        .timetable-class-cell:hover .actions {
            display: flex; /* Show on hover */
        }
        .timetable-class-cell.suspended {
            background-color: #fef2f2; /* Light red background */
            border-color: var(--error-color);
            opacity: 0.7;
            text-decoration: line-through;
        }
        .timetable-class-cell.altered {
            background-color: #fffbeb; /* Light yellow background */
            border-color: var(--warning-color);
        }
    </style>
</head>
<body>
    <div class="dashboard-layout">
        <nav class="sidebar">
            <div class="nav-brand">
                <h2>CampusIQ</h2>
                <span class="role-badge">Faculty</span>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="dashboard.html" class="nav-link">
                        <span class="icon">🏠</span> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a href="attendance.html" class="nav-link">
                        <span class="icon">✅</span> Attendance
                    </a>
                </li>
                <li class="nav-item">
                    <a href="marks.html" class="nav-link">
                        <span class="icon">📊</span> Marks
                    </a>
                </li>
                <li class="nav-item">
                    <a href="students.html" class="nav-link">
                        <span class="icon">🧑‍🎓</span> Students
                    </a>
                </li>
                <li class="nav-item">
                    <a href="timetable.html" class="nav-link active">
                        <span class="icon">📅</span> Timetable
                    </a>
                </li>
                <li class="nav-item">
                    <a href="resources.html" class="nav-link">
                        <span class="icon">📚</span> Resources
                    </a>
                </li>
                <li class="nav-item">
                    <a href="assessments.html" class="nav-link">
                        <span class="icon">📝</span> Assignments
                    </a>
                </li>
                <li class="nav-item">
                    <a href="profile.html" class="nav-link">
                        <span class="icon">👤</span> Profile
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link logout-btn">
                        <span class="icon">🚪</span> Logout
                    </a>
                </li>
            </ul>
        </nav>

        <main class="main-content">
            <header class="header">
                <h1>My Timetable</h1>
                <div class="header-actions">
                    <button class="btn secondary btn-sm" onclick="facultyTimetable.changeViewDate(-1)">
                        <span>&larr;</span> Previous Day
                    </button>
                    <span id="currentWeekRange" class="muted" style="margin: 0 10px;"></span>
                    <button class="btn secondary btn-sm" onclick="facultyTimetable.changeViewDate(1)">
                        Next Day <span>&rarr;</span>
                    </button>
                    <button class="btn primary btn-sm" onclick="facultyTimetable.exportTimetable()">
                        <span>📥</span> Export Timetable
                    </button>
                </div>
            </header>

            <div class="content-area">
                <div id="timetableAlert" style="display: none;"></div>

                <!-- Filter Bar -->
                <div class="card">
                    <div class="search-filter-bar">
                        <select id="branchFilter" class="form-select filter-select" onchange="facultyTimetable.loadTimetable()">
                            <option value="">All Branches</option>
                            <!-- Populated by JS -->
                        </select>
                        <select id="yearFilter" class="form-select filter-select" onchange="facultyTimetable.handleMainFilterChange()">
                            <option value="">All Years</option>
                            <option value="1">1st Year</option>
                            <option value="2">2nd Year</option>
                            <option value="3">3rd Year</option>
                            <option value="4">4th Year</option>
                        </select>
                        <select id="semesterFilter" class="form-select filter-select" onchange="facultyTimetable.loadTimetable()">
                            <option value="">All Semesters</option>
                            <!-- Populated dynamically by JS -->
                        </select>
                        <select id="sectionFilter" class="form-select filter-select" onchange="facultyTimetable.loadTimetable()">
                            <option value="">All Sections</option>
                            <option value="A">Section A</option>
                            <option value="B">Section B</option>
                            <option value="C">Section C</option>
                        </select>
                    </div>
                </div>

                <!-- Timetable Display -->
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Daily Schedule</h2>
                    </div>
                    <div id="timetableContainer">
                        <div class="loading">
                            <div class="spinner"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Alter Class Modal -->
    <div id="alterClassModal" class="modal-overlay" style="display: none;">
        <div class="modal" style="max-width: 600px;">
            <div class="modal-header">
                <h3 class="modal-title">Alter Class Assignment</h3>
                <button class="modal-close" onclick="facultyTimetable.hideAlterClassModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="alterClassForm">
                    <input type="hidden" id="alterEntryId">
                    <div class="form-group">
                        <label class="form-label">Class Details</label>
                        <p id="alterClassDetails" class="form-input-static"></p>
                    </div>
                    <div class="form-group">
                        <label for="alterDate" class="form-label">Alter Date *</label>
                        <input id="alterDate" type="date" name="alterDate" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Original Faculty</label>
                        <p id="alterOriginalFaculty" class="form-input-static"></p>
                    </div>
                    <div class="form-group">
                        <label for="alterNewFaculty" class="form-label">Assign to New Faculty *</label>
                        <select id="alterNewFaculty" class="form-select" required>
                            <option value="">Select New Faculty</option>
                            <!-- Populated by JS -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="alterReason" class="form-label">Reason for Alteration *</label>
                        <textarea id="alterReason" class="form-textarea" rows="3" required placeholder="e.g., Faculty on leave, substitute needed"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn secondary" onclick="facultyTimetable.hideAlterClassModal()">Cancel</button>
                <button type="submit" class="btn primary" form="alterClassForm">Save Alteration</button>
            </div>
        </div>
    </div>

    <!-- Suspend Class Modal -->
    <div id="suspendClassModal" class="modal-overlay" style="display: none;">
        <div class="modal" style="max-width: 600px;">
            <div class="modal-header">
                <h3 class="modal-title">Suspend Class</h3>
                <button class="modal-close" onclick="facultyTimetable.hideSuspendClassModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="suspendClassForm">
                    <input type="hidden" id="suspendEntryId">
                    <div class="form-group">
                        <label class="form-label">Class Details</label>
                        <p id="suspendClassDetails" class="form-input-static"></p>
                    </div>
                    <div class="form-group">
                        <label for="suspendDate" class="form-label">Suspend Date *</label>
                        <input id="suspendDate" type="date" name="suspendDate" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label for="suspendReason" class="form-label">Reason for Suspension *</label>
                        <textarea id="suspendReason" class="form-textarea" rows="3" required placeholder="e.g., Public holiday, unexpected event, faculty unavailable"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn secondary" onclick="facultyTimetable.hideSuspendClassModal()">Cancel</button>
                <button type="submit" class="btn danger" form="suspendClassForm">Confirm Suspension</button>
            </div>
        </div>
    </div>

    <script src="../js/database.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/faculty-timetable.js"></script>
</body>
</html>
