<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Resources - CampusIQ</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="dashboard-layout">
        <nav class="sidebar">
            <div class="nav-brand">
                <h2>CampusIQ</h2>
                <span class="role-badge">Student</span>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="dashboard.html" class="nav-link">
                        <span class="icon">🏠</span> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a href="attendance.html" class="nav-link">
                        <span class="icon">📅</span> My Attendance
                    </a>
                </li>
                <li class="nav-item">
                    <a href="marks.html" class="nav-link">
                        <span class="icon">📊</span> My Marks
                    </a>
                </li>
                <li class="nav-item">
                    <a href="resources.html" class="nav-link active">
                        <span class="icon">📚</span> Resources
                    </a>
                </li>
                <li class="nav-item">
                    <a href="assignments.html" class="nav-link">
                        <span class="icon">📝</span> Assignments
                    </a>
                </li>
                <li class="nav-item">
                    <a href="profile.html" class="nav-link">
                        <span class="icon">👤</span> Profile
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link logout-btn">
                        <span class="icon">🚪</span> Logout
                    </a>
                </li>
            </ul>
        </nav>

        <main class="main-content">
            <header class="header">
                <h1>Shared Resources</h1>
                <div class="header-actions">
                    <!-- Export button removed -->
                </div>
            </header>

            <div class="content-area">
                <div id="resourcesAlert" style="display: none;"></div>

                <!-- Filter Bar -->
                <div class="card">
                    <div class="search-filter-bar">
                        <select id="subjectFilter" class="form-select filter-select" onchange="studentResources.filterResources()">
                            <option value="">All My Subjects</option>
                            <!-- Options populated by JS -->
                        </select>
                        <select id="typeFilter" class="form-select filter-select" onchange="studentResources.filterResources()">
                            <option value="">All Types</option>
                            <option value="lecture_notes">Lecture Notes</option>
                            <option value="assignment">Assignment</option>
                            <option value="syllabus">Syllabus</option>
                            <option value="question_bank">Question Bank</option>
                            <option value="other">Other</option>
                        </select>
                        <input type="text" id="searchInput" class="form-input search-input" placeholder="Search resources...">
                    </div>
                </div>

                <!-- Resources List -->
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Available Resources</h2>
                        <div>
                            <span id="totalResourcesCount" class="badge badge-info">0 resources</span>
                        </div>
                    </div>
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Title</th>
                                    <th>Subject</th>
                                    <th>Type</th>
                                    <th>Uploaded By</th>
                                    <th>Upload Date</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="resourcesTableBody">
                                <tr>
                                    <td colspan="6" class="loading">
                                        <div class="spinner"></div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="pagination" id="pagination">
                        <!-- Pagination buttons will be generated by JavaScript -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/database.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/student-resources.js"></script>
</body>
</html>
